# UrbanTasker Application Configuration

spring.application.name=urbantasker
server.port=8080

# Database Configuration (SQLite)
# Self-contained embedded database file: no MySQL installation or service needed!
spring.datasource.url=jdbc:sqlite:urbantasker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA & Hibernate for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Multipart / File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Storage configuration for uploaded verification documents & photos
urbantasker.upload.dir=./uploads

# Thymeleaf & Static Resources
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Logging
logging.level.com.urbantasker=INFO
logging.level.org.springframework.security=INFO
