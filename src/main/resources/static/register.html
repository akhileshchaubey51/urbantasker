<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - UrbanTasker</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background: linear-gradient(135deg, #f7f8fc 0%, #f3effc 100%); min-height: 100vh;">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">
        <div class="logo-icon"><i class="bi bi-tools"></i></div>
        <span>UrbanTasker</span>
      </a>
      <div>
        <a href="/login.html" class="nav-link"><i class="bi bi-box-arrow-in-right"></i> Already have an account? Log in</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 620px; margin: 3rem auto; padding: 0 1.5rem;">
    <div class="card card-glass" style="padding: 2.2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem;">Create Your Account</h2>
        <p class="text-muted" style="font-size: 0.92rem;">Join UrbanTasker to book services or offer your expertise</p>
      </div>

      <form id="registerForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name *</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regUsername">Username *</label>
            <input type="text" id="regUsername" class="form-control" placeholder="e.g. rahul_s" required minlength="3">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="rahul@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regMobile">Mobile Number *</label>
            <input type="tel" id="regMobile" class="form-control" placeholder="9876543210" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="regRole">I Want To *</label>
            <select id="regRole" class="form-control" required>
              <option value="user" selected>Book Services (Customer)</option>
              <option value="provider">Offer Services (Provider)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regQuestion">Security Question *</label>
            <select id="regQuestion" class="form-control" required>
              <option value="What is your pet name?">What is your pet name?</option>
              <option value="What city were you born in?">What city were you born in?</option>
              <option value="What was your first school?">What was your first school?</option>
              <option value="What is your favorite food?">What is your favorite food?</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="regAnswer">Security Answer *</label>
            <input type="text" id="regAnswer" class="form-control" placeholder="Your secret answer" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regAddress">Service / Home Address</label>
          <input type="text" id="regAddress" class="form-control" placeholder="Flat, Street, City, Pincode">
        </div>

        <button type="submit" class="btn btn-secondary btn-lg" style="width: 100%; margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--secondary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
