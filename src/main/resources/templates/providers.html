<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Verified Professionals - UrbanTasker</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/customer.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">
        <div class="logo-icon"><i class="bi bi-tools"></i></div>
        <span>UrbanTasker</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/providers.html" class="nav-link active">Find Services</a></li>
        <li><a href="/dashboard.html" class="nav-link">My Dashboard</a></li>
      </ul>

      <div class="nav-auth" id="navbarAuthSection"></div>
    </div>
  </nav>

  <!-- SEARCH & FILTER HEADER -->
  <div style="background: linear-gradient(135deg, #f7f8fc 0%, #f3effc 100%); padding: 3rem 1.5rem; border-bottom: 1px solid var(--border-light);">
    <div class="container" style="max-width: 1000px;">
      <h1 style="font-size: 2.2rem; text-align: center; margin-bottom: 0.5rem;">Explore Verified Service Providers</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">
        Showing only background-checked and approved professionals across your area.
      </p>

      <!-- Search Filter Form -->
      <form id="filterForm" onsubmit="event.preventDefault(); applyFilters();" class="card" style="padding: 1.2rem; border-radius: var(--radius-md);">
        <div style="display: grid; grid-template-columns: 2fr 1.5fr 1fr auto; gap: 1rem; align-items: flex-end;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 0.8rem;">Service Category</label>
            <input type="text" id="filterService" class="form-control" placeholder="e.g. Electrician, Plumbing, AC Repair">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 0.8rem;">City / Region</label>
            <input type="text" id="filterCity" class="form-control" placeholder="e.g. New Delhi, Noida">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 0.8rem;">Sort By</label>
            <select id="filterSort" class="form-control">
              <option value="rating">Highest Rated</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="experience">Most Experienced</option>
            </select>
          </div>

          <div>
            <button type="submit" class="btn btn-secondary" style="height: 44px; padding: 0 1.5rem;">
              <i class="bi bi-funnel-fill"></i> Filter
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- PROVIDER RESULTS CONTAINER -->
  <main class="container" style="padding: 3rem 1.5rem 5rem 1.5rem;">
    <div id="providersGrid" class="provider-grid">
      <div class="text-center py-5 text-muted" style="grid-column: 1/-1;">
        <span class="spinner-border"></span> Loading approved service professionals...
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/customer.js"></script>
  <script>
    function applyFilters() {
      const s = document.getElementById('filterService').value.trim();
      const c = document.getElementById('filterCity').value.trim();
      const sort = document.getElementById('filterSort').value;
      const url = `/providers.html?serviceType=${encodeURIComponent(s)}&city=${encodeURIComponent(c)}&sortBy=${encodeURIComponent(sort)}`;
      window.history.pushState({}, '', url);
      CustomerModule.loadProvidersCatalog();
    }

    document.addEventListener('DOMContentLoaded', () => {
      CustomerModule.loadProvidersCatalog();
    });
  </script>
</body>
</html>
